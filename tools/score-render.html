<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ground-truth score renderer</title>
<style>
  html, body { margin: 0; background: #fff; }
  #paper { background: #fff; padding: 28px; width: 1400px; box-sizing: border-box; }
  #paper svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div id="paper"></div>
<script src="../node_modules/opensheetmusicdisplay/build/opensheetmusicdisplay.min.js"></script>
<script>
/**
 * Ground-truth score fixtures.
 *
 * A note is [midi, durationInDivisions] or [null, duration] for a rest.
 * DIV = divisions per quarter, BAR = divisions per 4/4 measure.
 * Exposes window.__GT__ so an external scorer knows exactly what was drawn.
 */
const DIV = 4;
const BAR = 32;

const TYPE_OF = {
  16: ['whole', 0], 12: ['half', 1], 8: ['half', 0], 6: ['quarter', 1],
  4: ['quarter', 0], 3: ['eighth', 1], 2: ['eighth', 0], 1: ['16th', 0],
};

const SHARP_PCS = [1, 3, 6, 8, 10];
const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];

function pitchXml(midi) {
  const pc = ((midi % 12) + 12) % 12;
  const letter = LETTERS[[0, 2, 4, 5, 7, 9, 11].indexOf(pc) >= 0
    ? [0, 2, 4, 5, 7, 9, 11].indexOf(pc) : 0];
  const alter = SHARP_PCS.includes(pc) ? '<alter>1</alter>' : '';
  return `<step>${letter}</step>${alter}<octave>${Math.floor(midi / 12) - 1}</octave>`;
}

function noteXml(note, staff) {
  const [midi, dur] = note;
  const [type, dots] = TYPE_OF[dur] || ['quarter', 0];
  const head = midi === null
    ? '<rest/>'
    : `<pitch>${pitchXml(midi)}</pitch>`;
  const dotXml = dots ? '<dot/>' + (dots > 1 ? '<dot/>' : '') : '';
  const staffXml = staff ? `<staff>${staff}</staff>` : '';
  return `<note>${head}<duration>${dur}</duration><voice>1</voice><type>${type}</type>${dotXml}${staffXml}</note>`;
}

function partXml(part) {
  const bars = [];
  let bar = [], cur = 0;
  for (const n of part.notes) {
    if (cur > 0 && cur + n[1] > BAR) { bars.push(bar); bar = []; cur = 0; }
    bar.push(noteXml(n));
    cur += n[1];
    if (cur >= BAR) { bars.push(bar); bar = []; cur = 0; }
  }
  if (bar.length) bars.push(bar);

  return bars.map((b, i) => {
    const attrs = i === 0
      ? `<attributes><divisions>${DIV}</divisions><key><fifths>0</fifths></key>` +
        `<time><beats>4</beats><beat-type>4</beat-type></time>` +
        `<clef number="1"><sign>${part.clef || 'G'}</sign><line>${part.clef === 'F' ? 4 : 2}</line></clef>` +
        `</attributes>`
      : '';
    return `<measure number="${i + 1}">${attrs}${b.join('')}</measure>`;
  }).join('');
}

function buildXml(piece) {
  const list = piece.parts.map((p, i) =>
    `<score-part id="P${i + 1}"><part-name>${p.name}</part-name></score-part>`).join('');
  const bodies = piece.parts.map((p, i) =>
    `<part id="P${i + 1}">${partXml(p)}</part>`).join('');
  return `<?xml version="1.0" encoding="UTF-8"?>
<score-partwise version="3.1">
  <work><work-title>${piece.name}</work-title></work>
  <part-list>${list}</part-list>${bodies}
</score-partwise>`;
}

/* ------------------------------------------------------------ fixtures */

const E4 = 64, F4 = 65, G4 = 67, A4 = 69;
const D4 = 62, C4 = 60, B3 = 59;
const C3 = 48, E2 = 40, F3 = 53, G2 = 43;
const w = 16, h = 8, q = 4, e = 2;

const PIECES = {
  /* Quarter notes only — the easiest thing an OMR can be asked to read. */
  simple: {
    name: 'GT Simple',
    parts: [{ name: 'Melody', clef: 'G', notes: [
      [E4, q], [E4, q], [F4, q], [G4, q],
      [G4, q], [F4, q], [E4, q], [D4, q],
    ]}],
  },

  /* Melodically monophonic, 8 bars, with a half-note cadence. */
  ode: {
    name: 'GT Ode to Joy',
    parts: [{ name: 'Melody', clef: 'G', notes: [
      [E4, q], [E4, q], [F4, q], [G4, q],
      [G4, q], [F4, q], [E4, q], [D4, q],
      [C4, q], [C4, q], [D4, q], [E4, q],
      [E4, h], [D4, q], [D4, q],
      [E4, q], [E4, q], [F4, q], [G4, q],
      [G4, q], [F4, q], [E4, q], [D4, q],
      [C4, q], [C4, q], [D4, q], [E4, q],
      [D4, h], [C4, h],
    ]}],
  },

  /* Eighths, rests and dotted notes — exercises duration reading. */
  rhythm: {
    name: 'GT Rhythm',
    parts: [{ name: 'Rhythm', clef: 'G', notes: [
      [C4, q], [D4, e], [E4, e], [null, e], [G4, e], [G4, e],
      [A4, q], [null, q], [G4, 3], [E4, e], [D4, e],
      [C4, q], [D4, e], [E4, e], [null, e], [G4, e], [G4, e],
      [A4, q], [null, q], [G4, 3], [E4, e], [D4, e],
    ]}],
  },

  /* Two simultaneous staves — the case that breaks naive OMR.
     Both parts are exactly two bars so the engraved system is complete:
     a piano grand staff lines its hands up measure for measure. */
  grand: {
    name: 'GT Two Staves',
    parts: [
      { name: 'Upper', clef: 'G', notes: [
        [E4, q], [E4, q], [F4, q], [G4, q],
        [G4, q], [F4, q], [E4, q], [D4, q],
      ]},
      { name: 'Lower', clef: 'F', notes: [
        [C3, h], [G2, h], [C3, h], [E2, h],
      ]},
    ],
  },

  /* Accidentals — a common source of wrong pitches. */
  sharps: {
    name: 'GT Sharps',
    parts: [{ name: 'Melody', clef: 'G', notes: [
      [F4, q], [A4, q], [F4, q], [A4, q],
      [G4, q], [B3, q], [G4, q], [D4, q],
    ]}],
  },
};

const key = new URLSearchParams(location.search).get('piece') || 'ode';
window.__GT__ = null;

/**
 * Ground truth must be an independent record of what was DRAWN, not a
 * restatement of the fixture source.
 *
 * The engraver silently drops or wraps measures when a system's parts do not
 * line up -- the two-staff fixture originally declared four bars of bass line
 * but only two bars reached the page. A ground truth copied from the source
 * then claims notes that were never printed, and the OMR scorer blames the OCR
 * for a fixture bug.
 *
 * VexFlow emits one g.vf-stavenote per note AND per rest, and a rest is
 * indistinguishable from a note by class alone, so the expected count is the
 * sounding notes plus the rests. Truncating a measure lowers that total, which
 * is exactly the failure this guards against.
 */
function countRenderedNoteheads() {
  const svg = document.querySelector('#paper svg');
  if (!svg) return 0;
  return svg.querySelectorAll('g.vf-stavenote').length;
}

(async () => {
  const piece = PIECES[key];
  if (!piece) { document.body.textContent = 'unknown piece: ' + key; return; }
  const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(document.getElementById('paper'), {
    autoResize: false, backend: 'svg', drawTitle: false, drawComposer: false,
    pageFormat: 'EndlessVertical',
  });
  window.__OSMD__ = osmd;
  await osmd.load(buildXml(piece), piece.name);
  osmd.render();

  const drawn = countRenderedNoteheads();
  const source = piece.parts.reduce((acc, p) =>
    acc + p.notes.filter((n) => n[0] !== null).length, 0);
  const rests = piece.parts.reduce((acc, p) =>
    acc + p.notes.filter((n) => n[0] === null).length, 0);
  const expected = source + rests;

  // Never let a fixture quietly claim notes that were not drawn.
  if (drawn !== expected) {
    console.warn(`GT MISMATCH: ${expected} note/rest groups in fixture, ${drawn} drawn on the page`);
  }

  window.__GT__ = {
    key,
    name: piece.name,
    sourceNotes: source,
    restCount: rests,
    renderedNotes: drawn,
    consistent: drawn === expected,
    // Grouped by staff so the scorer can compare hands independently. An
    // engraver interleaves the staves of a grand staff in one visual column,
    // and so does the OCR output; comparing one flat list against another
    // would call correct music wrong purely on ordering.
    staves: piece.parts.map((p, i) => ({
      index: i + 1,
      name: p.name,
      clef: p.clef,
      notes: p.notes.filter((n) => n[0] !== null)
        .map(([midi, dur]) => ({ midi, quarters: dur / DIV })),
    })),
    notes: piece.parts.flatMap((p) => p.notes
      .filter((n) => n[0] !== null)
      .map(([midi, dur]) => ({ midi, quarters: dur / DIV, part: p.name }))),
  };
  document.title = 'READY ' + key;
  window.__DONE__ = true;
})();
</script>
</body>
</html>
