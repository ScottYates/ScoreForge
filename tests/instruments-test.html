<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>instruments test</title>
<style>
  body { background:#0d1117; color:#c9d1d9; font:12px ui-monospace,Consolas,monospace; padding:10px; }
  .pass { color:#3fb950; } .fail { color:#f85149; }
</style>
</head>
<body>
<pre id="out">running…</pre>
<script type="module">
/* Headless verification of src/js/audio/instruments.js.
   Every instrument is a recording; the audible behaviour of the sampled
   instrument lives in sampler-test.html against synthetic buffers and in
   check-sampler-audio.mjs against the real pack. This suite pins the roster's
   shape and the one thing instruments.js itself decides: an instrument whose
   pack cannot be had is a SILENT instrument that answers the full interface
   and says why, never a crash and never an unreported nothing. */

import {
  DEFAULT_INSTRUMENT, INSTRUMENTS, INSTRUMENT_IDS, createInstrument, packFor,
} from '../src/js/audio/instruments.js';

const out = document.getElementById('out');
const SR = 44100;
const checks = [];
function check(name, ok, info = {}) { checks.push({ name, ok: !!ok, info }); }

async function run() {
  /* ------------------------------------------------------------- roster -- */
  check('twenty-nine recorded instruments', INSTRUMENTS.length === 29, { n: INSTRUMENTS.length });
  check('every entry is sampled and names its pack',
    INSTRUMENTS.every((i) => i.sampled === true && typeof i.pack === 'string' && i.pack.startsWith('fp-')));
  check('ids are unique', new Set(INSTRUMENT_IDS).size === INSTRUMENT_IDS.length);
  check('the default instrument is on the roster', INSTRUMENT_IDS.includes(DEFAULT_INSTRUMENT),
    { DEFAULT_INSTRUMENT });
  check('packFor answers for every id', INSTRUMENT_IDS.every((id) => typeof packFor(id) === 'string'));
  check('packFor is null for an unknown id', packFor('no-such-thing') === null);
  // The recordings of synthesisers were removed from the roster. A bank that
  // reintroduces a Synth group, or a name sold as synthesised, is a regression.
  const groups = [...new Set(INSTRUMENTS.map((i) => i.group))];
  check('no synth group remains', groups.every((g) => !/synth/i.test(g)), { groups });
  check('no instrument is named as synthesised',
    INSTRUMENTS.every((i) => !/synth/i.test(i.name)), {
      bad: INSTRUMENTS.filter((i) => /synth/i.test(i.name)).map((i) => i.id) });

  /* ----------------------------------------------------------- refusals -- */
  let threw = null;
  try { createInstrument('tenor-kazoo', new OfflineAudioContext(1, SR, SR)); } catch (e) { threw = e; }
  check('an unknown id throws, naming the roster', !!threw && /unknown instrument/.test(threw.message));
  threw = null;
  try { createInstrument(DEFAULT_INSTRUMENT, {}); } catch (e) { threw = e; }
  check('a non-AudioContext throws', !!threw && /AudioContext/.test(threw.message));

  /* -------------------------------------- no pack: silent, and says so -- */
  // This suite runs from file://, so no pack is loaded: every instrument must
  // come back as the silent one, with the full interface and its reason.
  const bad = [];
  for (const spec of INSTRUMENTS) {
    try {
      const ctx = new OfflineAudioContext(1, Math.ceil(SR * 0.1), SR);
      const v = createInstrument(spec.id, ctx, ctx.destination);
      if (v.sampled) { bad.push(`${spec.id}: sampled with no pack loaded`); continue; }
      if (!v.silent) { bad.push(`${spec.id}: not marked silent`); continue; }
      if (!v.reason || !v.reason.includes(spec.pack)) bad.push(`${spec.id}: reason does not name the pack (${v.reason})`);
      if (!Array.isArray(v.warnings) || !v.warnings.length) bad.push(`${spec.id}: no warnings entry`);
    } catch (e) {
      // A throw here is the regression under test: with no pack the contract
      // is a silent instrument, never an exception.
      bad.push(`${spec.id}: threw (${e && e.message})`);
    }
  }
  check('with no pack, every instrument is silent with its pack named', bad.length === 0,
    { first: bad.slice(0, 4) });

  // The silent instrument answers the whole Instrument contract without
  // throwing: the engine schedules against it and an export renders through
  // it, so a missing method is a crash in the middle of someone's render.
  const ctx = new OfflineAudioContext(1, Math.ceil(SR * 0.5), SR);
  let apiErr = null;
  let handle = null;
  try {
    // Inside the try: a createInstrument that THROWS with no pack is itself
    // the regression under test, and must fail these assertions, not the run.
    const v = createInstrument(DEFAULT_INSTRUMENT, ctx, ctx.destination);
    handle = v.noteOn({ midi: 60, velocity: 0.8, when: 0.02, duration: 0.2 });
    v.noteOff(handle, 0.1);
    v.setSustain(true, 0.1);
    v.setSustain(false, 0.2);
    v.setParam('level', 0.5, 0.1);
    v.sweep(0.3);
    v.allNotesOff(0.4);
    void v.params;
    v.debugStats();
    v.dispose(0.5);
  } catch (e) { apiErr = e; }
  check('the silent instrument answers the full interface', !apiErr && typeof handle === 'object',
    { err: apiErr && apiErr.message });

  // And it is actually silent: an offline render through it is all zeros.
  let peak = -1;
  try {
    const ctx2 = new OfflineAudioContext(1, Math.ceil(SR * 0.4), SR);
    const v2 = createInstrument(DEFAULT_INSTRUMENT, ctx2, ctx2.destination);
    v2.noteOn({ midi: 60, velocity: 0.9, when: 0.02, duration: 0.3 });
    const buf = await ctx2.startRendering();
    const d = buf.getChannelData(0);
    peak = 0;
    for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i]));
  } catch (e) { /* recorded by the check below */ }
  check('and renders digital silence', peak === 0, { peak });

  const failed = checks.filter((c) => !c.ok);
  const summary = {
    pass: failed.length === 0,
    checks: checks.length,
    failed: failed.length,
    failures: failed.map((f) => f.name + ' ' + JSON.stringify(f.info)),
    passed: checks.length - failed.length,
    fatal: null,
  };
  out.textContent = JSON.stringify(summary, null, 1);
  window.__RESULT__ = summary;
  window.__DONE__ = true;
}

run().catch((e) => {
  const failed = checks.filter((c) => !c.ok);
  window.__RESULT__ = {
    pass: false, passed: checks.length - failed.length, failed: failed.length + 1,
    checks: checks.length, failures: checks.filter((c) => !c.ok).map((f) => f.name),
    fatal: String(e && e.stack || e),
  };
  out.textContent = JSON.stringify(window.__RESULT__, null, 1);
  window.__DONE__ = true;
});
</script>
</body>
</html>
