<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sampler tests</title>
<style>
  body { background:#111; color:#ddd; font:12px ui-monospace,Consolas,monospace; margin:0; padding:12px; }
  #out { white-space:pre-wrap; }
  .pass { color:#7fd18a; }
  .fail { color:#ff6b6b; font-weight:bold; }
  h2 { color:#8ab4f8; font-size:13px; margin:14px 0 4px; }
</style>
</head>
<body>
<div id="out">running.</div>

<!--
  The assertion that matters here is "a single note produces audible output".

  An earlier attempt at recorded instruments fetched each sample inside noteOn
  and started the source from the decode callback. Every fetch returned 200,
  every decode succeeded, the transport advanced -- and nothing was audible,
  because the note's start time had passed before the source node existed.

  This suite is mutation-checked against exactly that: deleting the
  `v.start(when)` call in sampler.js turns it red. It may surface as an
  InvalidStateError from Web Audio rather than as a zero peak, because the
  platform refuses `stop()` on a source that was never started. Either way the
  run fails; the point is that silence cannot pass here.
-->
<script type="module">
import {
  createSampledInstrument, findOnset, __setPack, __setFetchedPack, __clearPacks,
  hasPack, isPackDecoded, filesForKeys,
  loadPack, preparePack, packState, __setPackBase,
} from '../src/js/audio/sampler.js';
// For the stale-manifest tests below: importing the roster is what fills the
// sampler's roster-to-pack table, exactly as the real page does.
import '../src/js/audio/instruments.js';

/* ===================================================== assertion harness === */

const lines = [];
let pass = 0, fail = 0;
const failures = [];
const out = document.getElementById('out');

function head(t) { lines.push('', '== ' + t + ' ' + '='.repeat(Math.max(0, 56 - t.length))); }
function line(text, cls) { lines.push(cls ? `<span class="${cls}">${text}</span>` : text); }
function ok(name, cond, detail = '') {
  if (cond) { pass++; line(`  PASS  ${name}`); }
  else { fail++; failures.push(name); line(`  FAIL  ${name}${detail ? '  - ' + detail : ''}`, 'fail'); }
}
function near(name, actual, expected, tol) {
  const good = Number.isFinite(actual) && Math.abs(actual - expected) <= tol;
  ok(name, good, `expected ${expected} +/- ${tol}, got ${actual}`);
}

/* ================================================================= fixtures */

/**
 * A buffer shaped like a real pack file: MARKER samples of digital silence,
 * then a decaying tone -- and then, deliberately, MORE silence at the front to
 * stand in for a codec that did not strip its encoder delay. findOnset has to
 * find the sound past both.
 */
const SR = 44100;
const MARKER = 1024;
const FAKE_DELAY = 1105;

function fakeBuffer(ctx, { freq = 440, seconds = 0.5, decay = 6, markerDelay = FAKE_DELAY } = {}) {
  const n = markerDelay + MARKER + Math.round(seconds * SR);
  const buf = ctx.createBuffer(1, n, SR);
  const d = buf.getChannelData(0);
  const start = markerDelay + MARKER;
  for (let i = start; i < n; i++) {
    const t = (i - start) / SR;
    d[i] = Math.sin(2 * Math.PI * freq * t) * Math.exp(-decay * t);
  }
  return buf;
}

/** A one-instrument pack with two round-robin takes per key. */
function installPack(ctx, opts = {}) {
  const buffers = {};
  const notes = {};
  const markerDelay = opts.markerDelay ?? FAKE_DELAY;
  for (const midi of [60, 64, 67, 72]) {
    notes[midi] = {
      rate: 1,
      hits: [0, 1].map((v) => {
        const file = `t/${midi}-${v}.mp3`;
        buffers[file] = fakeBuffer(ctx, {
          freq: 440 * Math.pow(2, (midi - 69) / 12) * (v ? 1.002 : 1),
          markerDelay,
          ...opts.hit,
        });
        return { f: file, g: 1, dur: opts.dur ?? 0.5, loop: opts.loop || null };
      }),
    };
  }
  return __setPack({
    id: 'testkit', name: 'Test Kit', lo: 60, hi: 72,
    sustains: !!opts.loop, notes, buffers,
  });
}

/** Render offline and hand back the peak plus where the sound actually began. */
async function render(ctx, seconds, play) {
  const off = new OfflineAudioContext(1, Math.ceil(ctx.sampleRate * seconds), ctx.sampleRate);
  const inst = createSampledInstrument('testkit', off, off.destination);
  play(inst, off);
  const buf = await off.startRendering();
  const d = buf.getChannelData(0);

  let peak = 0;
  let onset = -1;
  const win = Math.max(1, Math.round(buf.sampleRate * 0.0015));
  for (let i = 0; i < d.length; i++) {
    const a = Math.abs(d[i]);
    if (a > peak) peak = a;
  }
  // Onset by the same 1.5 ms window rule the pack uses, so the test measures
  // the property the sampler actually depends on.
  const thr = peak * 0.02;
  for (let w = 0; w + win <= d.length; w += win) {
    let s = 0;
    for (let i = w; i < w + win; i++) s += d[i] * d[i];
    if (Math.sqrt(s / win) > thr) { onset = w / buf.sampleRate; break; }
  }
  return { peak, onset, buf, d, inst };
}

/**
 * Dominant frequency of a stretch of rendered audio, by zero crossings.
 *
 * Enough for the test buffers, which are decaying sines. It counts the sign
 * changes rather than the raw rate so the DC that a ramped gain leaves behind
 * does not count as a crossing.
 *
 * A sine crosses zero TWICE per period, so the crossings are halved before they
 * become a frequency, and the one between the first and the last is not a whole
 * period: last-minus-first spans crossings-1 gaps, not crossings. Leaving either
 * of those out returns something very near, but not, the truth -- which reads
 * as an octave problem in the sampler under test rather than a division in the
 * measuring tape.
 */
function dominantHz(d, sr, from = 0, to = d.length) {
  let crossings = 0;
  let first = -1;
  let last = -1;
  for (let i = Math.max(1, from); i < to; i++) {
    if ((d[i - 1] <= 0 && d[i] > 0) || (d[i - 1] >= 0 && d[i] < 0)) {
      crossings++;
      if (first < 0) first = i;
      last = i;
    }
  }
  const periods = (crossings - 1) / 2;
  return periods > 0 && last > first ? (periods * sr) / (last - first) : 0;
}

const ctx = new OfflineAudioContext(1, 128, SR);

/* =============================================== the guard against silence == */

try {
  __clearPacks();

  head('an unloaded pack must be refused, not faked');

  let threw = null;
  try { createSampledInstrument('testkit', ctx, ctx.destination); } catch (e) { threw = e; }
  ok('createSampledInstrument throws when the pack is not loaded', !!threw, String(threw && threw.message));
  ok('the refusal names the pack and its state',
    !!threw && /testkit/.test(threw.message) && /not loaded/.test(threw.message),
    threw && threw.message);
  ok('hasPack is false before loading', !hasPack('testkit'));

  /* ============================ fetched is not the same as decoded ======== */

  head('a pack that was fetched but never decoded must be refused by name');

  {
    // Real page state between loadPack() and prepare(). If this were allowed
    // through, the roster would fall back to the modelled twin, make a sound,
    // and nothing anywhere would say the recording was never used.
    const notes = {};
    for (let m = 60; m <= 72; m++) {
      notes[m] = { rate: 1, hits: [{ f: `t/${m}-0.mp3`, g: 1, dur: 0.5, loop: null }] };
    }
    __setFetchedPack({
      id: 'testkit', name: 'Test Kit', lo: 60, hi: 72, sustains: false, notes,
      files: new Map([['t/60-0.mp3', new ArrayBuffer(8)]]),
    });
    ok('hasPack is true once fetched', hasPack('testkit'));
    ok('isPackDecoded is false until prepare has run', !isPackDecoded('testkit'));

    let e2 = null;
    try { createSampledInstrument('testkit', ctx, ctx.destination); } catch (e) { e2 = e; }
    ok('createSampledInstrument throws when the pack is not decoded', !!e2, String(e2 && e2.message));
    ok('the refusal names preparePack, not a fetch that already succeeded',
      !!e2 && /preparePack/.test(e2.message), e2 && e2.message);
    ok('the refusal still names the pack', !!e2 && /testkit/.test(e2.message), e2 && e2.message);
  }

  /* =================================== only the keys that will be played == */

  head('preparing a pack decodes the keys asked for, and no others');

  {
    __clearPacks();
    installPack(ctx);
    const pack = __setPack({
      id: 'keys', name: 'Keys', lo: 60, hi: 72, sustains: false, buffers: {},
      notes: Object.fromEntries([60, 64, 67, 72].map((m) => [m, {
        rate: 1, hits: [{ f: `k/${m}.mp3`, g: 1, dur: 0.5, loop: null }],
      }])),
    });

    const all = filesForKeys(pack).sort();
    ok('with no key list, every key is included', all.length === 4, all.join(','));

    const some = filesForKeys(pack, [60, 67]).sort();
    ok('only the requested keys are included',
      some.length === 2 && some[0] === 'k/60.mp3' && some[1] === 'k/67.mp3', some.join(','));

    // The rule that has to agree with noteOn's: a bank that does not cover the
    // whole keyboard plays its nearest key. If prepare resolved a missing key
    // differently from noteOn, the missing note would be silent.
    const nearest = filesForKeys(pack, [61]).sort();
    ok('a key the bank does not have resolves to its nearest neighbour',
      nearest.length === 1 && nearest[0] === 'k/60.mp3', nearest.join(','));

    const nearestHi = filesForKeys(pack, [70]).sort();
    ok('and the same at the top of the range',
      nearestHi.length === 1 && nearestHi[0] === 'k/72.mp3', nearestHi.join(','));

    const shared = filesForKeys(pack, [60, 61, 62]).sort();
    ok('several keys landing on one sample ask for it once', shared.length === 1, shared.join(','));

    ok('an empty key list decodes nothing rather than everything',
      filesForKeys(pack, []).length === 4, 'no keys means every key of the bank');
  }

  /* ================================================================ onset == */

  head('measuring where the sound really starts');

  {
    const buf = fakeBuffer(ctx, { markerDelay: 1105 });
    const at = findOnset(buf);
    near('onset skips the marker and the codec delay', at, (1105 + MARKER) / SR, 0.004);
    ok('a silent buffer reports no offset rather than a wrong one', findOnset(ctx.createBuffer(1, 4096, SR)) === 0);

    const delayed = fakeBuffer(ctx, { markerDelay: 4000 });
    near('a bigger codec delay is found too', findOnset(delayed), (4000 + MARKER) / SR, 0.004);
  }

  /* =============================================== it actually makes a sound */

  head('the note makes sound -- and at the right time');

  installPack(ctx);
  ok('hasPack is true once installed', hasPack('testkit'));

  {
    const WHEN = 0.25;
    const r = await render(ctx, 1.0, (inst, off) => {
      inst.noteOn({ midi: 60, velocity: 0.9, when: WHEN, duration: 0.4 });
    });
    // This is the assertion the first attempt at this feature would have
    // failed: everything reported success and the output was silence.
    ok('a single note produces audible output', r.peak > 0.02, `peak ${r.peak.toFixed(5)}`);
    near('the attack starts when it was scheduled', r.onset, WHEN, 0.006);
    ok('nothing sounds before the note', r.d[Math.floor(WHEN * SR * 0.5)] === 0);
  }

  {
    const WHEN = 0.1;
    const r = await render(ctx, 1.2, (inst) => {
      [60, 64, 67].forEach((m, i) => inst.noteOn({ midi: m, velocity: 0.8, when: WHEN + i * 0.01, duration: 0.6 }));
    });
    ok('a triad renders louder than a single note would', r.peak > 0.05, `peak ${r.peak.toFixed(5)}`);
  }

  /* ============================================================== velocity */

  head('velocity and pitch');

  {
    const soft = await render(ctx, 0.8, (inst) => inst.noteOn({ midi: 60, velocity: 0.2, when: 0.05, duration: 0.4 }));
    const hard = await render(ctx, 0.8, (inst) => inst.noteOn({ midi: 60, velocity: 1.0, when: 0.05, duration: 0.4 }));
    ok('a harder note is louder', hard.peak > soft.peak * 1.5,
      `${hard.peak.toFixed(4)} vs ${soft.peak.toFixed(4)}`);
  }

  {
    // Zero-crossing count over the tail gives the dominant frequency without
    // needing an FFT, and a wrong playbackRate is exactly what would break it.
    const freqOf = (d, sr, fromSec = 0.1, toSec = 0.35) => {
      let crossings = 0;
      let prev = 0;
      const a = Math.floor(fromSec * sr), b = Math.min(d.length, Math.floor(toSec * sr));
      for (let i = a; i < b; i++) {
        if ((d[i - 1] <= 0 && d[i] > 0) || (d[i - 1] >= 0 && d[i] < 0)) { if (i - 1 > a) crossings++; }
        prev = d[i];
      }
      void prev;
      return crossings / 2 / (toSec - fromSec);
    };
    installPack(ctx);
    const a = await render(ctx, 0.8, (inst) => inst.noteOn({ midi: 60, velocity: 0.9, when: 0.02, duration: 0.5 }));
    // MIDI 60 is middle C, 261.6 Hz. Getting this wrong once already: a
    // fixture that "should" be A4 would pass while the pitch shift was broken.
    near('midi 60 sounds at middle C', freqOf(a.d, SR), 261.63, 12);

    // midi 63 is not in the pack; it must fall back to the nearest key rather
    // than going quiet or throwing.
    const b = await render(ctx, 0.8, (inst) => inst.noteOn({ midi: 63, velocity: 0.9, when: 0.02, duration: 0.5 }));
    ok('a pitch with no sample falls back to a neighbour instead of silence',
      b.peak > 0.02, `peak ${b.peak.toFixed(5)}`);
  }

  /* ========================================================== round robin == */

  head('round robin');

  {
    let first = null, second = null;
    const seen = [];
    const r = await render(ctx, 1.0, (inst) => {
      for (let i = 0; i < 4; i++) {
        const h = inst.noteOn({ midi: 72, velocity: 0.7, when: 0.02 + i * 0.1, duration: 0.05 });
        seen.push(h && h.generation);
        first = h; second = h;
      }
    });
    ok('four strikes on one key all produce a handle', seen.every((g) => g != null), JSON.stringify(seen));
    ok('each strike is a fresh voice', new Set(seen).size === 4, JSON.stringify(seen));
    ok('and the repeat still makes sound', r.peak > 0.02, `peak ${r.peak.toFixed(5)}`);
  }

  /* ===================================================== velocity and rate == */

  head('hammer and tuning');

  {
    // Two hammers recorded for one key, an octave apart so this can tell which
    // one was played. Picking between them by round robin meant a written
    // crescendo changed the volume and not the timbre, and the same note in the
    // same bar came back with a different hammer each time it was repeated.
    __clearPacks();
    const lo = 'v/60-L.mp3';
    const hi = 'v/60-H.mp3';
    __setPack({
      id: 'testkit', name: 'Test Kit', lo: 60, hi: 72, sustains: false,
      buffers: {
        [lo]: fakeBuffer(ctx, { freq: 261.63, seconds: 0.5 }),
        [hi]: fakeBuffer(ctx, { freq: 523.25, seconds: 0.5 }),
      },
      notes: {
        60: {
          rate: 1,
          hits: [
            { f: lo, g: 1, dur: 0.5, loop: null, vel: 0.2 },
            { f: hi, g: 1, dur: 0.5, loop: null, vel: 0.85 },
          ],
        },
      },
    });

    const soft = await render(ctx, 0.6, (inst) => inst.noteOn({ midi: 60, velocity: 0.15, when: 0.02, duration: 0.4 }));
    const hard = await render(ctx, 0.6, (inst) => inst.noteOn({ midi: 60, velocity: 0.95, when: 0.02, duration: 0.4 }));
    const sr = soft.buf.sampleRate;
    const softHz = dominantHz(soft.d, sr);
    const hardHz = dominantHz(hard.d, sr);
    ok('a soft note picks the soft hammer', Math.abs(softHz - 261.63) < 15, `${softHz.toFixed(1)} Hz`);
    ok('a hard note picks the hard hammer', Math.abs(hardHz - 523.25) < 15, `${hardHz.toFixed(1)} Hz`);
    ok('the same key can play two different hammers', Math.abs(hardHz - softHz) > 200,
      `${softHz.toFixed(1)} vs ${hardHz.toFixed(1)} Hz`);
  }

  {
    // Two takes of one key, recorded a tone apart, each carrying its own rate.
    // The rate used to be stored once per key and written by every take in turn,
    // so whichever came last decided the pitch for both -- and on the FreePats
    // upright that left 7 of 176 takes up to 119 cents out.
    __clearPacks();
    const a = 'v/60-a.mp3';
    const b = 'v/60-b.mp3';
    const RATE_B = Math.pow(2, -2 / 12);
    __setPack({
      id: 'testkit', name: 'Test Kit', lo: 60, hi: 72, sustains: false,
      buffers: {
        [a]: fakeBuffer(ctx, { freq: 261.63, seconds: 0.3 }),
        [b]: fakeBuffer(ctx, { freq: 293.66, seconds: 0.3 }),
      },
      notes: {
        60: {
          rate: 1,
          hits: [
            { f: a, g: 1, dur: 0.3, loop: null, r: 1 },
            { f: b, g: 1, dur: 0.3, loop: null, r: RATE_B },
          ],
        },
      },
    });

    // Two notes in one render, because round-robin has to advance between them and
    // only one render advances it. They are 0.4 s apart so each one's tone has
    // finished before the other's measuring window opens -- and the first must
    // still be alive at the second noteOn, or reap() drops it, drop() disconnects
    // it, and in an OfflineAudioContext that disconnect takes effect for the
    // whole render rather than from the moment it happens. The first note came
    // back as pure silence until the gap was closed.
    const SECOND = 0.40;
    const r = await render(ctx, 1.1, (inst) => {
      inst.noteOn({ midi: 60, velocity: 0.8, when: 0.02, duration: 0.05 });
      inst.noteOn({ midi: 60, velocity: 0.8, when: SECOND, duration: 0.05 });
    });
    const sr = r.buf.sampleRate;
    // The test buffers carry 48 ms of leading silence standing in for the marker
    // and the codec delay, so a window starts after that, not at the moment the
    // note was scheduled. First tone runs 0.07-0.37, second 0.45-0.75.
    const first = dominantHz(r.d, sr, Math.floor(sr * 0.12), Math.floor(sr * 0.30));
    const second = dominantHz(r.d, sr, Math.floor(sr * (SECOND + 0.10)), Math.floor(sr * (SECOND + 0.28)));
    ok('each take plays at its own rate, so both land on the same pitch',
      Math.abs(first - 261.63) < 12 && Math.abs(second - 261.63) < 12,
      `${first.toFixed(1)} then ${second.toFixed(1)} Hz, expected 261.6`);
  }

  /* =============================================================== release == */

  head('note off');

  {
    const WHEN = 0.05, OFF = 0.15;
    const r = await render(ctx, 0.6, (inst, off2) => {
      const h = inst.noteOn({ midi: 60, velocity: 0.9, when: WHEN, duration: 2 });
      inst.noteOff(h, OFF);
    });
    const sr = r.buf.sampleRate;
    let after = 0;
    for (let i = Math.floor((OFF + 0.2) * sr); i < r.d.length; i++) after = Math.max(after, Math.abs(r.d[i]));
    ok('the tail is silent after the key is up', after < 1e-4, `residual ${after.toFixed(6)}`);
  }

  {
    const r = await render(ctx, 0.6, (inst) => {
      const h = inst.noteOn({ midi: 60, velocity: 0.9, when: 0.05, duration: 2 });
      inst.noteOff(h, 0.02); // a release *before* the note began
    });
    ok('a release earlier than the note does not silence it', r.peak > 0.02, `peak ${r.peak.toFixed(5)}`);
  }

  /* ================================================================= looping */

  head('holding a note longer than the sample');

  {
    // 0.5 s of sample, held for 1.5 s. Without looping the note would be gone
    // after half a second; the tail proves whether it kept going.
    installPack(ctx, { loop: [0.2, 0.45], hit: { seconds: 0.5 } });
    const dur = 0.5;
    const r = await render(ctx, 2.0, (inst) => {
      inst.noteOn({ midi: 60, velocity: 0.9, when: 0.02, duration: 1.5 });
    });
    const sr = r.buf.sampleRate;
    const tailPeak = (from, to) => {
      let p = 0;
      for (let i = Math.floor(from * sr); i < Math.floor(to * sr); i++) p = Math.max(p, Math.abs(r.d[i]));
      return p;
    };
    const early = tailPeak(0.05, 0.2);
    const late = tailPeak(dur + 0.3, dur + 0.9);
    ok('a held note is still sounding after the sample has passed', late > 0.01,
      `late peak ${late.toFixed(5)} vs early ${early.toFixed(5)}`);
  }

  {
    // The same note, released: the loop must stop with the key.
    const dur = 0.5;
    const r = await render(ctx, 2.0, (inst) => {
      const h = inst.noteOn({ midi: 60, velocity: 0.9, when: 0.02, duration: 3 });
      inst.noteOff(h, 0.2);
    });
    const sr = r.buf.sampleRate;
    let after = 0;
    for (let i = Math.floor(0.5 * sr); i < r.d.length; i++) after = Math.max(after, Math.abs(r.d[i]));
    ok('releasing a looping note actually stops it', after < 1e-4, `residual ${after.toFixed(6)}`);
  }

  {
    // noteOff scheduled *before* the note sounds, which is what the transport
    // does every time it runs ahead of the clock. Clearing src.loop at that
    // point applies from the first sample and the note never sustains.
    const dur = 0.5;
    let handle = null;
    const r = await render(ctx, 2.0, (inst) => {
      handle = inst.noteOn({ midi: 60, velocity: 0.9, when: 0.05, duration: 2 });
      inst.noteOff(handle, 1.2); // far in the future, called before any audio renders
    });
    ok('a release scheduled ahead of the note leaves it looping', handle.voice.looping === true,
      `looping=${handle.voice.looping}`);
    const sr = r.buf.sampleRate;
    const beforeEnd = (() => {
      let p = 0;
      for (let i = Math.floor((dur + 0.05) * sr); i < Math.floor((dur + 0.3) * sr); i++) {
        p = Math.max(p, Math.abs(r.d[i]));
      }
      return p;
    })();
    ok('and it really does keep sounding past the end of the take', beforeEnd > 0.01,
      `peak after the take ended: ${beforeEnd.toFixed(5)}`);
    let after = 0;
    for (let i = Math.floor(1.6 * sr); i < r.d.length; i++) after = Math.max(after, Math.abs(r.d[i]));
    ok('and the note still ends when the key comes up', after < 1e-4, `residual ${after.toFixed(6)}`);
  }

  /* ================================================================= housekeeping */

  /* ======================= samples are usable before the pack has arrived == */

  // Samples are the default sound, so the common case is a piece played while
  // the 277 MB background fetch is still running. Before this, preparePack
  // refused any pack until every file of every pack had arrived, and the piece
  // quietly played the synthesiser. These run loadPack() for real against a
  // stubbed fetch serving genuine WAV bytes, and judge it by the request log --
  // what was asked for, in what order, and how often -- not by timing.

  head('samples are usable before the whole pack has downloaded');

  {
    const BASE = 'http://pack.test/pack';
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    /** A short 16-bit mono WAV of a decaying sine: real bytes for decodeAudioData. */
    function wavBytes(freq, seconds = 0.25) {
      const n = Math.round(SR * seconds);
      const buf = new ArrayBuffer(44 + n * 2);
      const v = new DataView(buf);
      const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE');
      str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, SR, true); v.setUint32(28, SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
      str(36, 'data'); v.setUint32(40, n * 2, true);
      for (let i = 0; i < n; i++) {
        const s = Math.sin(2 * Math.PI * freq * (i / SR)) * Math.exp(-6 * i / SR) * 0.8;
        v.setInt16(44 + i * 2, Math.round(s * 32767), true);
      }
      return buf;
    }

    // Two packs: one big enough that its background fetch takes many rounds,
    // and one carrying a file the server will not serve.
    const KEYS = Array.from({ length: 48 }, (_, i) => 36 + i);
    const manifest = { version: 2, credits: {}, instruments: {} };
    const body = new Map();
    for (const id of ['big', 'other']) {
      const notes = {};
      for (const k of KEYS) {
        const f = `${id}/${k}.wav`;
        body.set(f, wavBytes(440 * Math.pow(2, (k - 69) / 12)));
        notes[k] = { rate: 1, hits: [{ f, g: 1, dur: 0.25, loop: null }] };
      }
      manifest.instruments[id] = { name: id, lo: KEYS[0], hi: KEYS[KEYS.length - 1], sustains: false, notes };
    }
    const MISSING = 'other/40.wav';

    const log = [];
    const realFetch = window.fetch;
    window.fetch = async (url, init = {}) => {
      const rel = decodeURIComponent(String(url).slice(BASE.length + 1));
      const priority = init.priority || null;
      log.push({ ev: 'start', rel, priority });
      await sleep(rel === 'manifest.json' ? 60 : 25);
      log.push({ ev: 'end', rel, priority });
      if (rel === 'manifest.json') return new Response(JSON.stringify(manifest), { status: 200 });
      if (rel === MISSING || !body.has(rel)) return new Response('', { status: 404, statusText: 'Not Found' });
      return new Response(body.get(rel).slice(0), { status: 200 });
    };

    try {
      __clearPacks();
      __setPackBase(BASE);

      const lp = loadPack();
      ok('a second loadPack while loading joins the same load', loadPack() === lp);

      // Asked for before the manifest has even arrived.
      const askedBeforeManifest = !hasPack('big');
      let early = null, earlyErr = null, stateWhenReady = null;
      try {
        early = await preparePack('big', [60]);
        stateWhenReady = packState().state;
      } catch (e) { earlyErr = e; }

      ok('preparePack was called before the manifest had arrived', askedBeforeManifest);
      ok('it waits for the manifest instead of refusing the pack', !!early && !earlyErr,
        earlyErr && earlyErr.message);
      ok('and is ready while the background fetch is still running', stateWhenReady === 'loading',
        `state when prepare finished: ${stateWhenReady}`);
      ok('the pack is decoded for the key asked for', isPackDecoded('big'));
      // Packs are registered now, mid-load. A loadPack that read "packs exist"
      // as "loaded" would hand this caller an early, already-resolved answer.
      ok('a loadPack after the packs are registered still joins the running load',
        packState().state === 'loading' && loadPack() === lp);

      // A sampled instrument, not a refusal and not the model: it plays.
      let peak = 0, playErr = null;
      try {
        const off = new OfflineAudioContext(1, Math.ceil(SR * 0.4), SR);
        const inst = createSampledInstrument('big', off, off.destination);
        inst.noteOn({ midi: 60, velocity: 0.8, when: 0.02, duration: 0.2 });
        const d = (await off.startRendering()).getChannelData(0);
        for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i]));
      } catch (e) { playErr = e; }
      ok('the early-prepared key plays from the recording', !playErr && peak > 0.02,
        playErr ? playErr.message : `peak ${peak.toFixed(4)}`);

      // While the on-demand fetch was in the air, the background must not have
      // started anything new: the key someone is about to hear goes first.
      const hiStart = log.findIndex((e) => e.ev === 'start' && e.priority === 'high');
      let hiEnd = -1;
      log.forEach((e, i) => { if (e.ev === 'end' && e.priority === 'high') hiEnd = i; });
      const bgStartsDuring = log.slice(hiStart + 1, hiEnd)
        .filter((e) => e.ev === 'start' && e.priority === 'low').length;
      ok('the key being prepared was fetched on demand, at high priority', hiStart >= 0 && hiEnd > hiStart,
        `high-priority fetches: ${log.filter((e) => e.ev === 'start' && e.priority === 'high').map((e) => e.rel).join(',')}`);
      ok('the background fetch starts nothing new until it has arrived', bgStartsDuring === 0,
        `${bgStartsDuring} background fetch(es) started during the on-demand one`);

      await lp;

      const starts = new Map();
      for (const e of log) if (e.ev === 'start') starts.set(e.rel, (starts.get(e.rel) || 0) + 1);
      const twice = [...starts].filter(([, n]) => n > 1).map(([r]) => r);
      ok('no file is fetched twice, on demand and in the background', twice.length === 0, twice.join(','));
      ok('every file was eventually fetched', starts.size === body.size + 1,
        `${starts.size} distinct requests for ${body.size} files + manifest`);

      const st = packState();
      ok('one missing file marks the load failed, and says how much is missing',
        st.state === 'failed' && /^1 of 96 sample files/.test(st.error || ''), `${st.state}: ${st.error}`);

      let stillOk = null, stillErr = null;
      try { stillOk = await preparePack('big', [72]); } catch (e) { stillErr = e; }
      ok('but the rest of the pack still prepares', !!stillOk && !stillErr, stillErr && stillErr.message);

      let missErr = null;
      try { await preparePack('other', [40]); } catch (e) { missErr = e; }
      ok('a piece that needs the missing take is told which file it was',
        !!missErr && missErr.message.includes(MISSING), missErr ? missErr.message : 'resolved');
    } finally {
      window.fetch = realFetch;
      __setPackBase(null);
      __clearPacks();
    }
  }

  /* ============== an offline render keeps the notes it already scheduled == */

  head('a note scheduled early survives the scheduling of a later one');

  {
    // The export path schedules a whole piece while the offline clock still
    // reads 0. By the last note, every earlier voice is already "finished" on
    // the timeline, and reap() retires it -- which must not detach its nodes
    // from the graph, because none of them has rendered a sample yet. When it
    // did, an exported MP3 kept only the notes still ringing at the end of
    // the piece: 34 seconds of silence, then the close. Two notes that do not
    // overlap are the whole bug: scheduling the second reaps the first.
    installPack(ctx);
    const r = await render(ctx, 2.4, (inst) => {
      const h = inst.noteOn({ midi: 60, velocity: 0.8, when: 0.05, duration: 0.1 });
      inst.noteOff(h, 0.15);
      inst.noteOn({ midi: 64, velocity: 0.8, when: 1.8, duration: 0.3 });
    });
    const sr = r.buf.sampleRate;
    const peakIn = (a, b) => {
      let p = 0;
      for (let i = Math.floor(a * sr); i < Math.min(r.d.length, Math.floor(b * sr)); i++) p = Math.max(p, Math.abs(r.d[i]));
      return p;
    };
    const early = peakIn(0.05, 0.5);
    const late = peakIn(1.8, 2.3);
    ok('the first note is audible', early > 0.02, `peak ${early.toFixed(5)} in [0.05, 0.5]`);
    ok('and so is the second', late > 0.02, `peak ${late.toFixed(5)} in [1.8, 2.3]`);
    ok('and the gap between them is really a gap', peakIn(0.9, 1.7) < 1e-4,
      `peak ${peakIn(0.9, 1.7).toFixed(6)} in [0.9, 1.7]`);
  }

  /* ===================== a pack older than the app must say so ========== */

  head('a server offering an older pack than the app is called out');

  {
    // The real event: the page fetched a cached, week-old manifest. The load
    // finished "ready" with every instrument that old pack had -- and none the
    // roster had gained since, so every part played the synthesiser on a page
    // reporting success. The mismatch has to be loud, and the manifest must
    // revalidate rather than trust whatever a cache holds.
    const BASE = 'http://stale.test/pack';
    const oldManifest = { version: 2, credits: {}, instruments: {
      'old-bank': { name: 'Old Bank', lo: 60, hi: 60, sustains: false,
        notes: { 60: { rate: 1, hits: [{ f: 'old-bank/60.mp3', g: 1, dur: 0.1, loop: null }] } } },
    } };
    let manifestCacheMode = null;
    const realFetch = window.fetch;
    window.fetch = async (url, init = {}) => {
      const rel = decodeURIComponent(String(url).slice(BASE.length + 1));
      if (rel === 'manifest.json') {
        manifestCacheMode = init.cache || null;
        return new Response(JSON.stringify(oldManifest), { status: 200 });
      }
      return new Response(new ArrayBuffer(8), { status: 200 });
    };
    try {
      __clearPacks();
      __setPackBase(BASE);
      await loadPack();

      ok('the manifest is revalidated, never taken from a cache on faith',
        manifestCacheMode === 'no-cache', `fetch cache mode: ${manifestCacheMode}`);

      const st = packState();
      ok('the load itself still succeeds for what the old pack has', st.state === 'ready', `${st.state}: ${st.error}`);
      ok('but every roster pack the manifest lacks is reported missing',
        st.missing.length > 0 && st.missing.includes('fp-upright'),
        `missing ${st.missing.length}, has fp-upright: ${st.missing.includes('fp-upright')}`);

      let err = null;
      try { await preparePack('fp-upright', [60]); } catch (e) { err = e; }
      ok('preparing a missing pack says the pack is older than the app, and what to do',
        !!err && /older pack than this app/.test(err.message) && /Hard-refresh/.test(err.message),
        err ? err.message : 'resolved');
    } finally {
      window.fetch = realFetch;
      __setPackBase(null);
      __clearPacks();
    }
  }

  head('housekeeping');

  {
    installPack(ctx);
    const r = await render(ctx, 1.0, (inst) => {
      for (let i = 0; i < 10; i++) inst.noteOn({ midi: 60 + (i % 4) * 4, velocity: 0.6, when: 0.02 + i * 0.01, duration: 0.1 });
      inst.allNotesOff(0.5);
    });
    const sr = r.buf.sampleRate;
    let after = 0;
    // After the release fade (KEY_RELEASE 0.12 s) has finished, not merely
    // after the call: allNotesOff is meant to ring down, not cut.
    for (let i = Math.floor(0.8 * sr); i < r.d.length; i++) after = Math.max(after, Math.abs(r.d[i]));
    ok('allNotesOff silences everything', after < 1e-4, `residual ${after.toFixed(6)}`);
    ok('it did make sound first', r.peak > 0.02, `peak ${r.peak.toFixed(5)}`);
  }

  {
    // The failure this catches: disconnecting on allNotesOff silences a note
    // that had not finished sounding, which reads as "the sampler is dead".
    installPack(ctx);
    const r = await render(ctx, 1.0, (inst) => {
      inst.noteOn({ midi: 60, velocity: 0.9, when: 0.02, duration: 3 });
      inst.allNotesOff(0.4);
    });
    const sr = r.buf.sampleRate;
    let justAfter = 0;
    for (let i = Math.floor(0.42 * sr); i < Math.floor(0.50 * sr); i++) justAfter = Math.max(justAfter, Math.abs(r.d[i]));
    ok('a note released by allNotesOff is still heard ringing down', justAfter > 1e-4,
      `peak just after ${justAfter.toFixed(6)}`);
  }

  {
    installPack(ctx);
    const stats = await render(ctx, 0.4, (inst) => {
      inst.noteOn({ midi: 60, velocity: 0.8, when: 0.02, duration: 0.2 });
      inst.dispose(0.3);
    });
    ok('dispose leaves the instrument marked disposed', stats.inst.debugStats().disposed === true);
    ok('and frees its voices', stats.inst.debugStats().voices === 0);
  }

  {
    installPack(ctx);
    const r = await render(ctx, 0.5, (inst) => {
      inst.setParam('brightness', 0.5);
      inst.noteOn({ midi: 60, velocity: 0.8, when: 0.02, duration: 0.2 });
    });
    ok('an unknown parameter warns instead of throwing', r.inst.warnings.length === 1,
      JSON.stringify(r.inst.warnings));
    ok('and it still plays', r.peak > 0.02, `peak ${r.peak.toFixed(5)}`);
  }

  __clearPacks();
} catch (e) {
  fail++;
  failures.push('EXCEPTION');
  lines.push('', `<span class="fail">EXCEPTION ${(e && e.stack) || e}</span>`);
  console.error(e);
}

/* =============================================================== summary === */
const summary = `${pass} passed, ${fail} failed`;
lines.unshift(`<span class="${fail ? 'fail' : 'pass'}">SAMPLER TESTS: ${summary}</span>`);
out.innerHTML = lines.join('\n');
window.__RESULT__ = { passed: pass, failed: fail, summary, fatal: null, failures };
window.__DONE__ = true;
document.title = `sampler ${summary}`;
</script>
</body>
</html>
