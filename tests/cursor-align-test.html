<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cursor alignment tests</title>
<style>
  body { background:#111; color:#ddd; font:12px ui-monospace,Consolas,monospace; margin:0; padding:12px; }
  #out { white-space:pre-wrap; }
  .pass { color:#7fd18a; }
  .fail { color:#ff6b6b; font-weight:bold; }
  /* OSMD needs a real laid-out host to engrave into. */
  #stage { position:absolute; left:-10000px; width:1200px; background:#fff; }
</style>
</head>
<body>
<div id="out">running.</div>
<div id="stage"></div>

<!--
  Does the playback cursor sit in the bar that is actually sounding?

  Playback runs on the parser's bar grid, where a bar is as long as what it
  contains. The notation engine lays the same bars out by its own arithmetic.
  On a well-formed score the two agree; on a score with an overfull bar, an
  empty bar or a short pickup — all three of which scanned scores produce —
  they drift further apart every bar, and the cursor slides visibly off the
  notes as it crosses the system. That drift is what these fixtures measure:
  for every parsed note, the cursor step chosen for that note's quarter must
  sit in that note's bar, at that note's position.
-->
<script src="../node_modules/opensheetmusicdisplay/build/opensheetmusicdisplay.min.js"></script>
<script type="module">
import { parseMusicXml } from '../src/js/io/musicxml.js';
import { NotationView } from '../src/js/render/notation.js';

const lines = [];
let pass = 0, fail = 0;
const failures = [];
const out = document.getElementById('out');
function head(t) { lines.push('', '== ' + t + ' ' + '='.repeat(Math.max(0, 56 - t.length))); }
function ok(name, cond, detail = '') {
  if (cond) { pass++; lines.push(`  PASS  ${name}`); }
  else { fail++; failures.push(name); lines.push(`<span class="fail">  FAIL  ${name}${detail ? '  - ' + detail : ''}</span>`); }
}

/* ---------------------------------------------------------------- fixtures */

const HEADER = `<?xml version="1.0" encoding="UTF-8"?>
<score-partwise version="4.0">
  <part-list><score-part id="P1"><part-name>Piano</part-name></score-part></part-list>
  <part id="P1">`;
const FOOTER = `</part></score-partwise>`;
const ATTRS = `<attributes><divisions>12</divisions><key><fifths>0</fifths></key>
  <time><beats>4</beats><beat-type>4</beat-type></time>
  <clef><sign>G</sign><line>2</line></clef></attributes>`;
const N = (step, oct, dur, type) =>
  `<note><pitch><step>${step}</step><octave>${oct}</octave></pitch><duration>${dur}</duration><type>${type}</type></note>`;
const R = (dur, type) => `<note><rest/><duration>${dur}</duration><type>${type}</type></note>`;
const Q = (s, o) => N(s, o, 12, 'quarter');

/** A well-formed little piece: every bar is exactly 4/4. */
const CLEAN = HEADER + `
  <measure number="1">${ATTRS}${Q('C', 4)}${Q('D', 4)}${Q('E', 4)}${Q('F', 4)}</measure>
  <measure number="2">${Q('G', 4)}${Q('A', 4)}${N('B', 4, 24, 'half')}</measure>
  <measure number="3">${Q('C', 5)}${R(12, 'quarter')}${Q('B', 4)}${Q('A', 4)}</measure>
  <measure number="4">${N('G', 4, 48, 'whole')}</measure>` + FOOTER;

/**
 * The shapes a scanned or loosely-exported score produces, all in one piece:
 * a short pickup bar, an EMPTY bar, an overfull bar (double length), and
 * ordinary bars after each -- so any drift the irregular bars introduce has
 * somewhere to show.
 */
const IRREGULAR = HEADER + `
  <measure number="0" implicit="yes">${ATTRS}${Q('G', 4)}</measure>
  <measure number="1">${Q('C', 4)}${Q('D', 4)}${Q('E', 4)}${Q('F', 4)}</measure>
  <measure number="2"></measure>
  <measure number="3">${Q('G', 4)}${Q('A', 4)}${Q('B', 4)}${Q('C', 5)}${Q('D', 5)}${Q('E', 5)}${Q('F', 5)}${Q('G', 5)}</measure>
  <measure number="4">${Q('E', 5)}${Q('C', 5)}${N('G', 4, 24, 'half')}</measure>
  <measure number="5">${N('C', 4, 48, 'whole')}</measure>` + FOOTER;

/* ------------------------------------------------------------- the measure */

async function alignment(name, xml) {
  const score = parseMusicXml(xml, { fileName: name + '.musicxml' });
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const view = new NotationView(stage);
  const loaded = await view.load(score);
  if (!loaded) return { name, error: view.notAvailable || 'load failed' };

  // load() defers the cursor-table build one frame; wait for it.
  const t0 = performance.now();
  while (!view.steps && performance.now() - t0 < 10000) {
    await new Promise((r) => setTimeout(r, 25));
  }
  if (!view.steps) return { name, error: 'cursor table never built' };

  const notes = score.parts[0].notes;
  const rows = [];
  for (const n of notes) {
    const idx = view._stepIndexFor(n.quarter);
    const step = view.steps[idx];
    rows.push({
      quarter: n.quarter, midi: n.midi,
      noteMeasure: n.measure, stepMeasure: step.measure,
      stepQuarter: step.quarter,
      barOk: step.measure === n.measure,
      quarterOk: Math.abs(step.quarter - n.quarter) < 1e-3,
    });
  }
  return { name, score, view, rows,
    barMisses: rows.filter((r) => !r.barOk),
    quarterMisses: rows.filter((r) => !r.quarterOk) };
}

try {
  head('parser provenance the cursor depends on');
  {
    const score = parseMusicXml(CLEAN);
    ok('the score carries its bar grid', Array.isArray(score.measureStarts) && score.measureStarts.length === score.measureCount + 1,
      JSON.stringify(score.measureStarts));
    ok('every note knows its bar', score.parts[0].notes.every((n) => Number.isInteger(n.measure)));
    const irr = parseMusicXml(IRREGULAR);
    ok('the irregular piece really is irregular: its bars differ in length',
      new Set(irr.measureStarts.slice(1).map((q, i) => q - irr.measureStarts[i])).size >= 3,
      JSON.stringify(irr.measureStarts));
  }

  head('a well-formed score: cursor steps sit exactly on the notes');
  {
    const r = await alignment('clean', CLEAN);
    ok('it loads and builds a cursor table', !r.error, r.error);
    if (!r.error) {
      ok('every note is matched by a step in its own bar', r.barMisses.length === 0,
        JSON.stringify(r.barMisses.slice(0, 3)));
      ok('and at its own quarter', r.quarterMisses.length === 0,
        JSON.stringify(r.quarterMisses.slice(0, 3)));
    }
  }

  head('pickup, empty and overfull bars: the cursor must not drift');
  {
    const r = await alignment('irregular', IRREGULAR);
    ok('it loads and builds a cursor table', !r.error, r.error);
    if (!r.error) {
      ok('every note is matched by a step in its own bar, through all the irregular bars',
        r.barMisses.length === 0, JSON.stringify(r.barMisses.slice(0, 4)));
      ok('and at its own quarter on the playback grid', r.quarterMisses.length === 0,
        JSON.stringify(r.quarterMisses.slice(0, 4)));
      // The property that was broken: drift GROWS across the piece, so the
      // last bar is where it shows. Pin it explicitly.
      const last = r.rows[r.rows.length - 1];
      ok('the final note still lines up', last.barOk && last.quarterOk, JSON.stringify(last));
      // Steps must stay in playback order or the binary search cannot be
      // trusted to pick them.
      let monotonic = true;
      for (let i = 1; i < r.view.steps.length; i++) {
        if (r.view.steps[i].quarter < r.view.steps[i - 1].quarter - 1e-6) monotonic = false;
      }
      ok('the remapped step table stays monotonic', monotonic);
    }
  }
} catch (e) {
  fail++;
  failures.push('EXCEPTION');
  lines.push('', `<span class="fail">EXCEPTION ${(e && e.stack) || e}</span>`);
  console.error(e);
}

const summary = `${pass} passed, ${fail} failed`;
lines.unshift(`<span class="${fail ? 'fail' : 'pass'}">CURSOR ALIGNMENT: ${summary}</span>`);
out.innerHTML = lines.join('\n');
window.__RESULT__ = { passed: pass, failed: fail, summary, fatal: null, failures };
window.__DONE__ = true;
document.title = `cursor-align ${summary}`;
</script>
</body>
</html>
